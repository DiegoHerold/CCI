# Extensões locais opcionais. Os serviços funcionais do compose principal
# continuam inalterados e estes perfis só iniciam quando solicitados.
services:
  gateway:
    image: nginx:1.27-alpine
    profiles: ["gateway"]
    depends_on:
      web-app:
        condition: service_healthy
      bff:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/gateway/routes.conf:/etc/nginx/conf.d/routes.conf:ro
    networks:
      - cci-network

  prometheus:
    image: prom/prometheus:v3.12.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - cci-network

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - cci-network
