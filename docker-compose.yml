name: cci-platform

services:
  postgres-app:
    image: postgres:16
    container_name: cci-postgres-app
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cci_platform}
      POSTGRES_USER: ${POSTGRES_USER:-cci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cci_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cci} -d ${POSTGRES_DB:-cci_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cci-network

  temporal-postgres:
    image: postgres:16
    container_name: cci-temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_password}
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER:-temporal} -d ${TEMPORAL_POSTGRES_DB:-temporal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cci-network

  redis:
    image: redis:7-alpine
    container_name: cci-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cci-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cci-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cci}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cci_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - cci-network

  minio:
    image: minio/minio:latest
    container_name: cci-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-cci_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-cci_minio_password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cci-network

  minio-setup:
    image: minio/mc:latest
    container_name: cci-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cci_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cci_minio_password}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKETS_FILE: /config/buckets.txt
    volumes:
      - ./infra/scripts/create-minio-buckets.sh:/scripts/create-minio-buckets.sh:ro
      - ./infra/minio/buckets/buckets.txt:/config/buckets.txt:ro
    entrypoint: /bin/sh
    command: ["-c", "until /scripts/create-minio-buckets.sh; do sleep 2; done"]
    restart: "no"
    networks:
      - cci-network

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: cci-temporal
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_password}
      POSTGRES_SEEDS: ${TEMPORAL_POSTGRES_HOST:-temporal-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - cci-network

  temporal-ui:
    image: temporalio/ui:latest
    container_name: cci-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"
    networks:
      - cci-network

  identity-service:
    build:
      context: ./services/identity-service
    container_name: cci-identity-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: identity-service
      PORT: 8101
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cci}:${POSTGRES_PASSWORD:-cci_password}@postgres-app:5432/${POSTGRES_DB:-cci_platform}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCK_MINUTES: ${AUTH_LOCK_MINUTES:-15}
      AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-10}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres-app:
        condition: service_healthy
    ports:
      - "8101:8101"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8101/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cci-network

  client-service:
    build:
      context: ./services/client-service
    container_name: cci-client-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: client-service
      PORT: 8102
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cci}:${POSTGRES_PASSWORD:-cci_password}@postgres-app:5432/${POSTGRES_DB:-cci_platform}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8101}
      IDENTITY_TIMEOUT_SECONDS: ${IDENTITY_TIMEOUT_SECONDS:-5}
      DEFAULT_COMPETENCE_FOLDER_PATTERN: "{{YYYY}}/{{MM}}"
    depends_on:
      postgres-app:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    ports:
      - "8102:8102"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8102/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cci-network

  document-service:
    build:
      context: ./services/document-service
    container_name: cci-document-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: document-service
      PORT: 8110
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cci}:${POSTGRES_PASSWORD:-cci_password}@postgres-app:5432/${POSTGRES_DB:-cci_platform}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8101}
      IDENTITY_TIMEOUT_SECONDS: ${IDENTITY_TIMEOUT_SECONDS:-5}
      CLIENT_SERVICE_URL: ${CLIENT_SERVICE_URL:-http://client-service:8102}
      CLIENT_SERVICE_TIMEOUT_SECONDS: ${CLIENT_SERVICE_TIMEOUT_SECONDS:-5}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cci_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cci_minio_password}
      MINIO_BUCKET_DOCUMENTS_ORIGINAL: ${MINIO_BUCKET_DOCUMENTS_ORIGINAL:-cci-documents-original}
      MINIO_BUCKET_DOCUMENTS_PREVIEW: ${MINIO_BUCKET_DOCUMENTS_PREVIEW:-cci-documents-preview}
      DOCUMENT_MAX_FILE_SIZE_MB: ${DOCUMENT_MAX_FILE_SIZE_MB:-50}
      DOCUMENT_MAX_ZIP_SIZE_MB: ${DOCUMENT_MAX_ZIP_SIZE_MB:-200}
      DOCUMENT_MAX_FILES_PER_ZIP: ${DOCUMENT_MAX_FILES_PER_ZIP:-100}
      DOCUMENT_ALLOWED_EXTENSIONS: ${DOCUMENT_ALLOWED_EXTENSIONS:-.pdf,.xlsx,.xls,.csv,.txt,.docx,.xml,.zip}
      PARSER_WORKER_URL: ${PARSER_WORKER_URL:-http://parser-worker:8121}
      PARSER_WORKER_TIMEOUT_SECONDS: ${PARSER_WORKER_TIMEOUT_SECONDS:-60}
      PARSER_MAX_FILE_SIZE_MB: ${PARSER_MAX_FILE_SIZE_MB:-100}
      PARSER_PREVIEW_MAX_JSON_SIZE_MB: ${PARSER_PREVIEW_MAX_JSON_SIZE_MB:-25}
    depends_on:
      postgres-app:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      client-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      parser-worker:
        condition: service_healthy
    ports:
      - "8110:8110"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8110/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cci-network

  template-service:
    build:
      context: ./services/template-service
    container_name: cci-template-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: template-service
      PORT: ${TEMPLATE_SERVICE_PORT:-8120}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cci}:${POSTGRES_PASSWORD:-cci_password}@postgres-app:5432/${POSTGRES_DB:-cci_platform}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8101}
      IDENTITY_TIMEOUT_SECONDS: ${IDENTITY_TIMEOUT_SECONDS:-5}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8110}
      DOCUMENT_SERVICE_TIMEOUT_SECONDS: ${DOCUMENT_SERVICE_TIMEOUT_SECONDS:-5}
      TEMPLATE_DATABASE_SCHEMA: ${TEMPLATE_DATABASE_SCHEMA:-template}
      TEMPLATE_MAX_SELECTION_PAYLOAD_KB: ${TEMPLATE_MAX_SELECTION_PAYLOAD_KB:-256}
      TEMPLATE_MAX_RULE_CONFIG_KB: ${TEMPLATE_MAX_RULE_CONFIG_KB:-128}
      TEMPLATE_MATCH_MIN_CONFIDENCE: ${TEMPLATE_MATCH_MIN_CONFIDENCE:-0.75}
      TEMPLATE_MATCH_AUTO_ACCEPT_CONFIDENCE: ${TEMPLATE_MATCH_AUTO_ACCEPT_CONFIDENCE:-0.90}
      TEMPLATE_MATCH_AMBIGUITY_DELTA: ${TEMPLATE_MATCH_AMBIGUITY_DELTA:-0.08}
      TEMPLATE_MATCH_MAX_CANDIDATES: ${TEMPLATE_MATCH_MAX_CANDIDATES:-10}
      TEMPLATE_PROFILE_TEXT_SAMPLE_LIMIT: ${TEMPLATE_PROFILE_TEXT_SAMPLE_LIMIT:-5000}
      TEMPLATE_PROFILE_MAX_KEYWORDS: ${TEMPLATE_PROFILE_MAX_KEYWORDS:-200}
    depends_on:
      postgres-app:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
    ports:
      - "${TEMPLATE_SERVICE_PORT:-8120}:8120"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8120/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cci-network

  extraction-service:
    build:
      context: ./services/extraction-service
    container_name: cci-extraction-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: extraction-service
      PORT: ${EXTRACTION_SERVICE_PORT:-8130}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cci}:${POSTGRES_PASSWORD:-cci_password}@postgres-app:5432/${POSTGRES_DB:-cci_platform}
      EXTRACTION_DATABASE_SCHEMA: ${EXTRACTION_DATABASE_SCHEMA:-extraction}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8101}
      IDENTITY_TIMEOUT_SECONDS: ${IDENTITY_TIMEOUT_SECONDS:-5}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8110}
      DOCUMENT_SERVICE_TIMEOUT_SECONDS: ${DOCUMENT_SERVICE_TIMEOUT_SECONDS:-5}
      TEMPLATE_SERVICE_URL: ${TEMPLATE_SERVICE_URL:-http://template-service:8120}
      TEMPLATE_SERVICE_TIMEOUT_SECONDS: ${TEMPLATE_SERVICE_TIMEOUT_SECONDS:-5}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      EXTRACTION_TASK_QUEUE: ${EXTRACTION_TASK_QUEUE:-extraction-task-queue}
      EXTRACTION_MAX_ATTEMPTS: ${EXTRACTION_MAX_ATTEMPTS:-3}
      EXTRACTION_RETRY_INITIAL_INTERVAL_SECONDS: ${EXTRACTION_RETRY_INITIAL_INTERVAL_SECONDS:-5}
      EXTRACTION_RETRY_BACKOFF_COEFFICIENT: ${EXTRACTION_RETRY_BACKOFF_COEFFICIENT:-2}
      EXTRACTION_RETRY_MAX_INTERVAL_SECONDS: ${EXTRACTION_RETRY_MAX_INTERVAL_SECONDS:-60}
      EXTRACTION_WORKFLOW_TIMEOUT_SECONDS: ${EXTRACTION_WORKFLOW_TIMEOUT_SECONDS:-900}
      EXTRACTION_ACTIVITY_TIMEOUT_SECONDS: ${EXTRACTION_ACTIVITY_TIMEOUT_SECONDS:-300}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cci_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cci_minio_password}
      MINIO_BUCKET_EXTRACTION_ARTIFACTS: ${MINIO_BUCKET_EXTRACTION_ARTIFACTS:-cci-extraction-artifacts}
      PDF_EXTRACTOR_WORKER_TASK_QUEUE: ${PDF_EXTRACTOR_WORKER_TASK_QUEUE:-pdf-extractor-task-queue}
      EXCEL_EXTRACTOR_WORKER_TASK_QUEUE: ${EXCEL_EXTRACTOR_WORKER_TASK_QUEUE:-excel-extractor-task-queue}
      PDF_EXTRACTOR_WORKER_URL: ${PDF_EXTRACTOR_WORKER_URL:-http://pdf-extractor-worker:8131}
      EXCEL_EXTRACTOR_WORKER_URL: ${EXCEL_EXTRACTOR_WORKER_URL:-http://excel-extractor-worker:8132}
      EXTRACTOR_WORKER_TIMEOUT_SECONDS: ${EXTRACTOR_WORKER_TIMEOUT_SECONDS:-60}
      NORMALIZATION_LOW_CONFIDENCE_THRESHOLD: ${NORMALIZATION_LOW_CONFIDENCE_THRESHOLD:-0.75}
      NORMALIZATION_DEFAULT_LOCALE: ${NORMALIZATION_DEFAULT_LOCALE:-pt-BR}
      NORMALIZATION_DATE_FORMATS: ${NORMALIZATION_DATE_FORMATS:-DD/MM/YYYY,YYYY-MM-DD,DD-MM-YYYY}
      NORMALIZATION_MONTH_FORMATS: ${NORMALIZATION_MONTH_FORMATS:-MM/YYYY,YYYY-MM,MMMM/YYYY,MMM/YYYY}
      NORMALIZATION_MAX_FIELDS_PER_RESULT: ${NORMALIZATION_MAX_FIELDS_PER_RESULT:-50000}
      NORMALIZATION_MAX_ARRAY_ITEMS: ${NORMALIZATION_MAX_ARRAY_ITEMS:-20000}
      NORMALIZATION_PRESERVE_RAW_VALUE: ${NORMALIZATION_PRESERVE_RAW_VALUE:-true}
    depends_on:
      postgres-app:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      template-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      pdf-extractor-worker:
        condition: service_healthy
      excel-extractor-worker:
        condition: service_healthy
    ports:
      - "${EXTRACTION_SERVICE_PORT:-8130}:8130"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8130/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cci-network

  parser-worker:
    build:
      context: ./workers/parser-worker
    container_name: cci-parser-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: parser-worker
      PORT: 8121
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cci_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cci_minio_password}
      PARSER_WORKER_CONCURRENCY: ${PARSER_WORKER_CONCURRENCY:-2}
      PARSER_MAX_FILE_SIZE_MB: ${PARSER_MAX_FILE_SIZE_MB:-100}
      PARSER_PREVIEW_MAX_JSON_SIZE_MB: ${PARSER_PREVIEW_MAX_JSON_SIZE_MB:-25}
    depends_on:
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "8121:8121"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8121/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cci-network

  pdf-extractor-worker:
    build:
      context: ./workers/pdf-extractor-worker
    container_name: cci-pdf-extractor-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: pdf-extractor-worker
      PORT: 8131
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cci_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cci_minio_password}
      EXTRACTOR_WORKER_CONCURRENCY: ${EXTRACTOR_WORKER_CONCURRENCY:-2}
      EXTRACTOR_MAX_PREVIEW_SIZE_MB: ${EXTRACTOR_MAX_PREVIEW_SIZE_MB:-25}
      EXTRACTOR_MAX_TABLE_ROWS: ${EXTRACTOR_MAX_TABLE_ROWS:-10000}
      EXTRACTOR_DEBUG_OUTPUT: ${EXTRACTOR_DEBUG_OUTPUT:-true}
    depends_on:
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "8131:8131"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8131/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cci-network

  excel-extractor-worker:
    build:
      context: ./workers/excel-extractor-worker
    container_name: cci-excel-extractor-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: excel-extractor-worker
      PORT: 8132
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-cci_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-cci_minio_password}
      EXTRACTOR_WORKER_CONCURRENCY: ${EXTRACTOR_WORKER_CONCURRENCY:-2}
      EXTRACTOR_MAX_PREVIEW_SIZE_MB: ${EXTRACTOR_MAX_PREVIEW_SIZE_MB:-25}
      EXTRACTOR_MAX_TABLE_ROWS: ${EXTRACTOR_MAX_TABLE_ROWS:-10000}
      EXTRACTOR_DEBUG_OUTPUT: ${EXTRACTOR_DEBUG_OUTPUT:-true}
    depends_on:
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "8132:8132"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8132/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cci-network

  bff:
    build:
      context: ./apps/bff
    container_name: cci-bff
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVICE_NAME: bff
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8101}
      CLIENT_SERVICE_URL: ${CLIENT_SERVICE_URL:-http://client-service:8102}
      DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8110}
      TEMPLATE_SERVICE_URL: ${TEMPLATE_SERVICE_URL:-http://template-service:8120}
      EXTRACTION_SERVICE_URL: ${EXTRACTION_SERVICE_URL:-http://extraction-service:8130}
      CONFERENCE_MODEL_SERVICE_URL: ${CONFERENCE_MODEL_SERVICE_URL:-http://conference-model-service:8103}
      SCHEDULE_SERVICE_URL: ${SCHEDULE_SERVICE_URL:-http://schedule-service:8104}
      DOCUMENT_INGESTION_SERVICE_URL: ${DOCUMENT_INGESTION_SERVICE_URL:-http://document-ingestion-service:8110}
      DOCUMENT_CLASSIFICATION_SERVICE_URL: ${DOCUMENT_CLASSIFICATION_SERVICE_URL:-http://document-classification-service:8111}
      VARIABLE_REGISTRY_SERVICE_URL: ${VARIABLE_REGISTRY_SERVICE_URL:-http://variable-registry-service:8120}
      RULE_SERVICE_URL: ${RULE_SERVICE_URL:-http://rule-service:8130}
      EXECUTION_CONTROL_SERVICE_URL: ${EXECUTION_CONTROL_SERVICE_URL:-http://execution-control-service:8140}
      RESULT_SERVICE_URL: ${RESULT_SERVICE_URL:-http://result-service:8141}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL:-http://audit-service:8150}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL:-http://report-service:8160}
      LOG_SERVICE_URL: ${LOG_SERVICE_URL:-http://log-service:8170}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      AUTH_REFRESH_COOKIE_SAMESITE: ${AUTH_REFRESH_COOKIE_SAMESITE:-lax}
      AUTH_REFRESH_COOKIE_MAX_AGE: ${AUTH_REFRESH_COOKIE_MAX_AGE:-604800}
    depends_on:
      identity-service:
        condition: service_healthy
      client-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      template-service:
        condition: service_healthy
      extraction-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cci-network

  web-app:
    build:
      context: ./apps/web
    container_name: cci-web-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL:-http://localhost:8000/api/v1}
      PORT: 3000
    depends_on:
      bff:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cci-network

  postgres-client-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_DB: cci_client_test
      POSTGRES_USER: cci_test
      POSTGRES_PASSWORD: cci_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci_test -d cci_client_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - cci-network

  client-service-test:
    build:
      context: ./services/client-service
    profiles: ["test"]
    environment:
      APP_ENV: test
      SERVICE_NAME: client-service
      DATABASE_URL: postgresql+psycopg://cci_test:cci_test_password@postgres-client-test:5432/cci_client_test
      IDENTITY_SERVICE_URL: http://identity-service:8101
      DEFAULT_COMPETENCE_FOLDER_PATTERN: "{{YYYY}}/{{MM}}"
    depends_on:
      postgres-client-test:
        condition: service_healthy
    command: sh -c "alembic upgrade head && pytest -q"
    networks:
      - cci-network

  postgres-document-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_DB: cci_document_test
      POSTGRES_USER: cci_test
      POSTGRES_PASSWORD: cci_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci_test -d cci_document_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - cci-network

  document-service-test:
    build:
      context: ./services/document-service
    profiles: ["test"]
    environment:
      APP_ENV: test
      SERVICE_NAME: document-service
      DATABASE_URL: postgresql+psycopg://cci_test:cci_test_password@postgres-document-test:5432/cci_document_test
      IDENTITY_SERVICE_URL: http://identity-service:8101
      CLIENT_SERVICE_URL: http://client-service:8102
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: cci_minio
      MINIO_SECRET_KEY: cci_minio_password
      MINIO_BUCKET_DOCUMENTS_ORIGINAL: cci-documents-original
      MINIO_BUCKET_DOCUMENTS_PREVIEW: cci-documents-preview
      DOCUMENT_MAX_FILE_SIZE_MB: 10
      DOCUMENT_MAX_ZIP_SIZE_MB: 50
      DOCUMENT_MAX_FILES_PER_ZIP: 20
      PARSER_WORKER_URL: http://parser-worker:8121
      PARSER_MAX_FILE_SIZE_MB: 10
      PARSER_PREVIEW_MAX_JSON_SIZE_MB: 5
    depends_on:
      postgres-document-test:
        condition: service_healthy
    command: sh -c "alembic upgrade head && pytest -q"
    networks:
      - cci-network

  postgres-template-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_DB: cci_template_test
      POSTGRES_USER: cci_test
      POSTGRES_PASSWORD: cci_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci_test -d cci_template_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - cci-network

  template-service-test:
    build:
      context: ./services/template-service
    profiles: ["test"]
    environment:
      APP_ENV: test
      SERVICE_NAME: template-service
      DATABASE_URL: postgresql+psycopg://cci_test:cci_test_password@postgres-template-test:5432/cci_template_test
      IDENTITY_SERVICE_URL: http://identity-service:8101
      DOCUMENT_SERVICE_URL: http://document-service:8110
      TEMPLATE_DATABASE_SCHEMA: template
      TEMPLATE_MAX_SELECTION_PAYLOAD_KB: 64
      TEMPLATE_MAX_RULE_CONFIG_KB: 64
      TEMPLATE_MATCH_MIN_CONFIDENCE: 0.75
      TEMPLATE_MATCH_AUTO_ACCEPT_CONFIDENCE: 0.90
      TEMPLATE_MATCH_AMBIGUITY_DELTA: 0.08
      TEMPLATE_MATCH_MAX_CANDIDATES: 10
      TEMPLATE_PROFILE_TEXT_SAMPLE_LIMIT: 5000
      TEMPLATE_PROFILE_MAX_KEYWORDS: 200
    depends_on:
      postgres-template-test:
        condition: service_healthy
    command: sh -c "alembic upgrade head && pytest -q"
    networks:
      - cci-network

  postgres-extraction-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_DB: cci_extraction_test
      POSTGRES_USER: cci_test
      POSTGRES_PASSWORD: cci_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci_test -d cci_extraction_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - cci-network

  extraction-service-test:
    build:
      context: ./services/extraction-service
    profiles: ["test"]
    environment:
      APP_ENV: test
      SERVICE_NAME: extraction-service
      DATABASE_URL: postgresql+psycopg://cci_test:cci_test_password@postgres-extraction-test:5432/cci_extraction_test
      IDENTITY_SERVICE_URL: http://identity-service:8101
      DOCUMENT_SERVICE_URL: http://document-service:8110
      TEMPLATE_SERVICE_URL: http://template-service:8120
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      EXTRACTION_DATABASE_SCHEMA: extraction
      EXTRACTION_MAX_ATTEMPTS: 3
      MINIO_BUCKET_EXTRACTION_ARTIFACTS: cci-extraction-artifacts
      PDF_EXTRACTOR_WORKER_TASK_QUEUE: pdf-extractor-task-queue
      EXCEL_EXTRACTOR_WORKER_TASK_QUEUE: excel-extractor-task-queue
      PDF_EXTRACTOR_WORKER_URL: http://pdf-extractor-worker:8131
      EXCEL_EXTRACTOR_WORKER_URL: http://excel-extractor-worker:8132
      EXTRACTOR_WORKER_TIMEOUT_SECONDS: 60
      NORMALIZATION_LOW_CONFIDENCE_THRESHOLD: 0.75
      NORMALIZATION_MAX_FIELDS_PER_RESULT: 50000
      NORMALIZATION_MAX_ARRAY_ITEMS: 20000
    depends_on:
      postgres-extraction-test:
        condition: service_healthy
    command: sh -c "alembic upgrade head && pytest -q"
    networks:
      - cci-network

  pdf-extractor-worker-test:
    build:
      context: ./workers/pdf-extractor-worker
    profiles: ["test"]
    environment:
      APP_ENV: test
      SERVICE_NAME: pdf-extractor-worker
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: cci_minio
      MINIO_SECRET_KEY: cci_minio_password
    command: pytest -q
    networks:
      - cci-network

  excel-extractor-worker-test:
    build:
      context: ./workers/excel-extractor-worker
    profiles: ["test"]
    environment:
      APP_ENV: test
