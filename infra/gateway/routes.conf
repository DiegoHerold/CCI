server {
  listen 8080;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://bff:8000/api/;
  }

  location /web/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://web-app:3000/;
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://web-app:3000/;
  }
  # Consoles administrativos devem permanecer restritos ao ambiente local:
  # location /minio/ { proxy_pass http://minio:9001/; }
  # location /rabbitmq/ { proxy_pass http://rabbitmq:15672/; }
  # location /temporal/ { proxy_pass http://temporal-ui:8080/; }
}
